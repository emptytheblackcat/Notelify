name: 'Build Notelify Releases'

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Select OS to build (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      build_beta:
        description: 'Build using beta-main.cpp?'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe_name: notelify
            zip_name: notelify-linux.zip
            target: linux
          - os: windows-latest
            exe_name: notelify.exe
            zip_name: notelify-windows.zip
            target: windows
          - os: macos-latest
            exe_name: notelify
            zip_name: notelify-macos.zip
            target: macos

    steps:
      # Step-level guard check to skip steps on unselected matrix runners
      - name: Check if Step Should Run
        id: check_run
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.target_os }}" = "all" ] || [ "${{ inputs.target_os }}" = "${{ matrix.target }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Checkout repository
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set Source File
        if: steps.check_run.outputs.should_run == 'true'
        id: source
        run: |
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          BUILD_BETA="${{ inputs.build_beta }}"

          if [ "$IS_PRERELEASE" = "true" ] || [ "$BUILD_BETA" = "true" ]; then
            echo "SRC=beta-main.cpp" >> $GITHUB_ENV
            echo "Building Pre-release version using beta-main.cpp"
          else
            echo "SRC=main.cpp" >> $GITHUB_ENV
            echo "Building Official version using main.cpp"
          fi
        shell: bash

      # Windows Compilation
      - name: Compile C++ Code (Windows)
        if: steps.check_run.outputs.should_run == 'true' && runner.os == 'Windows'
        run: |
          g++ -std=c++17 -O2 $env:SRC -o ${{ matrix.exe_name }} -static -static-libgcc -static-libstdc++

      # Linux Compilation
      - name: Compile C++ Code (Linux)
        if: steps.check_run.outputs.should_run == 'true' && runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O2 $SRC -o ${{ matrix.exe_name }} -static-libgcc -static-libstdc++

      # macOS Compilation
      - name: Compile C++ Code (macOS)
        if: steps.check_run.outputs.should_run == 'true' && runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -O2 $SRC -o ${{ matrix.exe_name }} -stdlib=libc++

      # Packaging
      - name: Create ZIP Package (Windows)
        if: steps.check_run.outputs.should_run == 'true' && runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.exe_name }} -DestinationPath ${{ matrix.zip_name }}

      - name: Create ZIP Package (Linux / macOS)
        if: steps.check_run.outputs.should_run == 'true' && runner.os != 'Windows'
        run: |
          zip ${{ matrix.zip_name }} ${{ matrix.exe_name }}

      # Release Attachment (Runs ONLY during an actual Release event)
      - name: Upload ZIP to Release
        if: steps.check_run.outputs.should_run == 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Artifact Upload (Runs during manual workflow_dispatch triggers for testing builds)
      - name: Upload Build Artifact (Manual Run)
        if: steps.check_run.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
