name: 'Build Notelify Releases'
permissions:
  contents: read
  pull-requests: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Select OS to build (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      build_beta:
        description: 'Build using beta-main.cpp?'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe_name: notelify
            zip_name: notelify-linux.zip
            target: linux
          - os: windows-latest
            exe_name: notelify.exe
            zip_name: notelify-windows.zip
            target: windows
          - os: macos-latest
            exe_name: notelify
            zip_name: notelify-macos.zip
            target: macos

    steps:
      - name: Checkout repository
        if: |
          github.event_name == 'release' || 
          inputs.target_os == 'all' || 
          inputs.target_os == matrix.target
        uses: actions/checkout@v4

      # Determine which source file to compile
      - name: Set Source File
        id: source
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ] || [ "${{ inputs.build_beta }}" = "true" ]; then
            echo "SRC=beta-main.cpp" >> $GITHUB_ENV
            echo "Building Pre-release version using beta-main.cpp"
          else
            echo "SRC=main.cpp" >> $GITHUB_ENV
            echo "Building Official version using main.cpp"
          fi
        shell: bash

      # Windows: MinGW static linking
      - name: Compile C++ Code (Windows)
        if: |
          runner.os == 'Windows' && (
            github.event_name == 'release' || 
            inputs.target_os == 'all' || 
            inputs.target_os == matrix.target
          )
        run: |
          g++ -std=c++17 -O2 $env:SRC -o ${{ matrix.exe_name }} -static -static-libgcc -static-libstdc++

      # Linux: GCC static linking
      - name: Compile C++ Code (Linux)
        if: |
          runner.os == 'Linux' && (
            github.event_name == 'release' || 
            inputs.target_os == 'all' || 
            inputs.target_os == matrix.target
          )
        run: |
          g++ -std=c++17 -O2 $SRC -o ${{ matrix.exe_name }} -static-libgcc -static-libstdc++

      # macOS: Clang static libc++ linking
      - name: Compile C++ Code (macOS)
        if: |
          runner.os == 'macOS' && (
            github.event_name == 'release' || 
            inputs.target_os == 'all' || 
            inputs.target_os == matrix.target
          )
        run: |
          clang++ -std=c++17 -O2 $SRC -o ${{ matrix.exe_name }} -stdlib=libc++

      # Zip creation for Windows
      - name: Create ZIP Package (Windows)
        if: |
          runner.os == 'Windows' && (
            github.event_name == 'release' || 
            inputs.target_os == 'all' || 
            inputs.target_os == matrix.target
          )
        run: |
          Compress-Archive -Path ${{ matrix.exe_name }} -DestinationPath ${{ matrix.zip_name }}

      # Zip creation for Linux & macOS
      - name: Create ZIP Package (Linux / macOS)
        if: |
          runner.os != 'Windows' && (
            github.event_name == 'release' || 
            inputs.target_os == 'all' || 
            inputs.target_os == matrix.target
          )
        run: |
          zip ${{ matrix.zip_name }} ${{ matrix.exe_name }}

      # Upload ZIP file to GitHub Release
      - name: Upload ZIP to Release
        if: |
          github.event_name == 'release' || 
          inputs.target_os == 'all' || 
          inputs.target_os == matrix.target
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
